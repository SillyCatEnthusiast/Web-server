services:
  nginx-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-manager
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP
      - "443:443"    # HTTPS
      - "50001:81"   # NPM web UI
    volumes:
      - ./nginx/data:/data
      - ./nginx/letsencrypt:/etc/letsencrypt
    networks:
      - web

  nodejs:
    build: ./nodejs
    container_name: nodejs
    restart: unless-stopped
    # env_file:
    #   - ./nodejs/.env
    environment:
      - PORT=3001
    # volumes:
    #   - ./nodejs/data:/app/data
    networks:
      - web
networks:
  web:
    driver: bridge
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "jaeger"
    static_configs:
      - targets: ["jaeger:14269"]

  - job_name: "otel-metrics-export"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "otel-collector-internal"
    static_configs:
      - targets: ["otel-collector:8888"]
  